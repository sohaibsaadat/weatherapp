<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="image.png" type="image/png" sizes="32x32">

    <title>Check Your City's Real Time Weather</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <div class="header">
            <div class="input"><input type="text" id="keyword" placeholder="Enter City Name"></div>
            <div class="search" id="searchBtn"><img src="search.svg" alt=""></div>
        </div>
        <div class="cityname">
            <h1 id="city">Your City</h1>
        </div>
        <div class="weatherimg">
            <h1 id="temp">Temperature</h1>
            <img id="img" src="sunny.svg" alt="">
            <h2 id="weather">Weather</h2>
            <h6 id="feels">Feels Like</h6>
        </div>
    <div class="otherinfo">
        <div class="humidity"><img src="icons8-humidity-96.png" alt=""> <h5 id="humidity">Humidity </h5></div>
        <div class="wind"><img src="icons8-wind-96.png" alt=""><h5 id="wind">Windspeed</h5></div>
    </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
